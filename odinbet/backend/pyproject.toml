[project]
name = "odinbet-backend"
version = "0.1.0"
description = "ODINBET AI-powered sports betting picker backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "polars>=1.0",
    "pandas>=2.2",
    "numpy>=1.26,<2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "nba-api>=1.6",
    "joblib>=1.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odinbet_backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_any_generics = false
disallow_untyped_defs = false
exclude = ["data", ".venv", "build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
